<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secure Connect - Chat</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; padding: 0 12px; }
    input, button { padding: 8px; margin: 4px 0; }
    #chat { display: none; }
    #messages { border: 1px solid #ccc; height: 260px; overflow-y: auto; padding: 8px; margin-bottom: 8px; }
    .system { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <h2>Secure Connect Chat</h2>

  <div id="login">
    <input id="username" placeholder="username" /><br />
    <input id="password" type="password" placeholder="password" /><br />
    <button onclick="login()">Login</button>
    <p id="error" style="color:red"></p>
  </div>

  <div id="chat">
    <div id="messages"></div>
    <input id="text" placeholder="Type a message" style="width:70%" />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket;

    async function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const res = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();

      if (!data.success) {
        document.getElementById("error").textContent = data.message;
        return;
      }

      document.getElementById("login").style.display = "none";
      document.getElementById("chat").style.display = "block";
      connectSocket(data.token);
    }

    function connectSocket(token) {
      socket = io({ auth: { token } });

      socket.on("chat:message", (m) => addLine(`[${m.time}] ${m.username}: ${m.text}`));
      socket.on("chat:system", (t) => addLine(t, "system"));
      socket.on("connect_error", (e) => addLine("Connection error: " + e.message, "system"));
    }

    function sendMessage() {
      const input = document.getElementById("text");
      if (!input.value.trim()) return;
      socket.emit("chat:message", input.value);
      input.value = "";
    }

    function addLine(text, cls) {
      const div = document.createElement("div");
      div.textContent = text;
      if (cls) div.className = cls;
      const box = document.getElementById("messages");
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
